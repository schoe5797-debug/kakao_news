name: kakao-news-briefing

on:
  schedule:
    # 08:00 KST == 23:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          # Optional tuning (set as Secrets only if you want):
          # GEMINI_MODEL: gemini-2.0-flash
          # MAX_ARTICLES: 10
          # INTL_TARGET: 6
          # NAVER_CLIENT_ID / NAVER_CLIENT_SECRET: for Naver OpenAPI
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          MAX_ARTICLES: ${{ secrets.MAX_ARTICLES }}
          INTL_TARGET: ${{ secrets.INTL_TARGET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python app.py
